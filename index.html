<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>迈克尔·杰克逊：人生选择</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 由 ui.js 动态渲染：引导 / 状态栏 / 事件卡 / 选项 / 结局 -->
  </div>

  <!-- 模块按依赖顺序加载（经典脚本，可直接双击打开 index.html 运行） -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n_events_en.js"></script>
  <script src="js/events.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function showFatal(e) {
        var app = document.getElementById('app');
        if (!app || app.dataset.fatal) return;
        app.dataset.fatal = '1';
        var m = (e && e.error && e.error.stack) ? e.error.stack : ((e && e.message) ? e.message : String(e));
        app.innerHTML = '<div style="padding:28px;color:#f3e2b0;font-family:sans-serif;line-height:1.6">' +
          '<h2 style="color:#ffb4b4">运行时出错（请把这段信息反馈给开发者）</h2>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;color:#ffd2d2;font-size:13px">' + m + '</pre></div>';
      }
      window.addEventListener('error', showFatal);
      try { MJ.ui.init(); } catch (e) { showFatal(e); throw e; }
    });
  </script>
</body>
</html>
